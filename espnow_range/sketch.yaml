# arduino-cli (programmer.py) builds from this; the Arduino IDE ignores it. Shared code lives in src/.
# arduino-cli installs everything listed here on the first compile.
# add a library:        - ArduinoJson (7.4.2)
profiles:
  c3:
    fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc  # Super Mini: Serial over the USB-C port
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries: []
default_profile: c3
